font_family      family="ProggyClean Nerd Font Mono" style=Regular
bold_font        family="ProggyClean Nerd Font Mono" style=Regular
italic_font      family="ProggyClean Nerd Font Mono" style=Regular
bold_italic_font family="ProggyClean Nerd Font Mono" style=Regular
font_size        12
copy_on_select   yes
window_padding_width 2
enable_audio_bell no
notify_on_cmd_finish never
background_opacity 0.95

map ctrl+shift+r load_config_file
mouse_map right press ungrabbed paste_from_clipboard


# Long-running TUI sessions (Claude Code) render inline, so the conversation
# lives in kitty's scrollback rather than an in-app viewport.
scrollback_lines 50000
# Separate on-disk buffer for ctrl+shift+h (pager view), in MB.
scrollback_pager_history_size 64

# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME
