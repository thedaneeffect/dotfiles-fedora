[terminal]
vt = 1

[default_session]
# --cmd runs sway via `env` so XDG_CURRENT_DESKTOP is set. Launching sway bare leaves it
# unset, which makes xdg-desktop-portal ignore /usr/share/xdg-desktop-portal/sway-portals.conf.
command = "tuigreet --cmd 'env XDG_CURRENT_DESKTOP=sway sway' --remember --remember-session --asterisks --asterisks-char '* ' --time --time-format '%A, %B %d  %H:%M' --greeting 'Welcome back.' --greet-align center --width 50 --window-padding 2 --container-padding 2 --prompt-padding 1 --theme 'border=green;text=white;prompt=green;time=gray;action=gray;button=green;container=black;input=white;greet=white;title=green'"
user = "greetd"
